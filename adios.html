<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Anchor</title>
<style>
:root{--bg:#FBFCFC;--fg:#041836;--mut:#3D485B;--line:#BEC5D1}
@media (prefers-color-scheme:dark){:root{--bg:#041836;--fg:#FBFCFC;--mut:#BEC5D1;--line:#3D485B}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:64px 16px}
h1{font-size:30px;margin:0 0 12px}p{color:var(--mut)}
.card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:24px 0}
.card b{color:var(--fg)}
a.btn{display:inline-block;margin:8px 8px 0 0;padding:10px 18px;border-radius:10px;border:1px solid var(--fg);color:var(--fg);text-decoration:none;font-weight:600}
a.btn.primary{background:var(--fg);color:var(--bg)}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
<h1 id="h"></h1>
<p id="p1"></p>
<div class="card"><p id="p2" style="margin:0"></p></div>
<p><a class="btn primary" id="re" href="#"></a><a class="btn" id="mail" href="#"></a></p>
<p><small id="priv"></small></p>
</main>
<script>
// Antes de publicar: poné la URL de la ficha en la tienda y tu email.
var STORE_URL = 'https://chromewebstore.google.com/';
var EMAIL = 'juancruzgomezs@gmail.com';
var T = {
 'es': ['Gracias por probar Anchor', 'Si la desinstalaste porque ya no la necesitabas, mejor todavía. Si algo no te funcionó, nos ayuda saberlo.', 'Un dato: el ancla sirve cuando el impulso es más fuerte que la intención. Si lo que te molestó fue el candado o la demora, probá bajarlos en Ajustes antes de irte: son configurables.', 'Reinstalar Anchor', 'Contarme qué pasó', 'Esta página no recoge ningún dato ni usa cookies.'],
 'en': ['Thanks for trying Anchor', 'If you removed it because you no longer needed it, even better. If something did not work for you, we would like to know.', 'One tip: an anchor helps when the impulse is stronger than the intention. If the lock or the delay bothered you, you can lower them in Settings before leaving.', 'Reinstall Anchor', 'Tell me what happened', 'This page collects no data and uses no cookies.'],
 'pt': ['Obrigado por testar o Anchor', 'Se você removeu porque não precisava mais, ótimo. Se algo não funcionou, queremos saber.', 'Uma dica: a âncora ajuda quando o impulso é mais forte que a intenção. Se o cadeado ou a espera incomodaram, dá para reduzi-los nos Ajustes.', 'Reinstalar o Anchor', 'Contar o que aconteceu', 'Esta página não coleta dados nem usa cookies.'],
 'fr': ['Merci d\'avoir essayé Anchor', 'Si vous l\'avez retiré parce que vous n\'en aviez plus besoin, tant mieux. Si quelque chose n\'a pas marché, dites-le-nous.', 'Un conseil : l\'ancre aide quand l\'impulsion est plus forte que l\'intention. Si le cadenas ou le délai vous ont gêné, vous pouvez les réduire dans les réglages.', 'Réinstaller Anchor', 'Dire ce qui s\'est passé', 'Cette page ne collecte aucune donnée et n\'utilise pas de cookies.'],
 'de': ['Danke fürs Ausprobieren von Anchor', 'Wenn du es entfernt hast, weil du es nicht mehr brauchst, umso besser. Wenn etwas nicht funktioniert hat, sag es uns gern.', 'Ein Tipp: Ein Anker hilft, wenn der Impuls stärker ist als die Absicht. Wenn dich das Schloss oder die Wartezeit gestört hat, kannst du beides in den Einstellungen verringern.', 'Anchor neu installieren', 'Erzählen, was passiert ist', 'Diese Seite sammelt keine Daten und nutzt keine Cookies.'],
 'it': ['Grazie per aver provato Anchor', 'Se l\'hai rimossa perché non ti serviva più, meglio così. Se qualcosa non ha funzionato, ci piacerebbe saperlo.', 'Un consiglio: l\'ancora aiuta quando l\'impulso è più forte dell\'intenzione. Se il lucchetto o l\'attesa ti hanno dato fastidio, puoi ridurli nelle Impostazioni.', 'Reinstalla Anchor', 'Racconta cosa è successo', 'Questa pagina non raccoglie dati e non usa cookie.']
};
var l = (navigator.language || 'es').slice(0, 2); var s = T[l] || T.en;
document.documentElement.lang = T[l] ? l : 'en';
['h','p1','p2','re','mail','priv'].forEach(function (id, i) { document.getElementById(id).textContent = s[i]; });
document.getElementById('re').href = STORE_URL;
document.getElementById('mail').href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent('Anchor');
</script>
</body>
</html>
