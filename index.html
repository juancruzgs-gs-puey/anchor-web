<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anchor</title>
<style>
:root{--bg:#FBFCFC;--fg:#041836;--mut:#3D485B;--line:#BEC5D1}

body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:64px 16px}h1{font-size:32px;margin:0 0 8px}p,li{color:var(--mut)}a{color:var(--fg)}

</head>
<body><main>
<h1>Anchor</h1>
<p id="d"></p>
<ul><li><a id="a" href="privacy.html"></a></li></ul>
<script>
var es=(navigator.language||'es').slice(0,2)==='es';document.documentElement.lang=es?'es':'en';
document.getElementById('d').textContent=es?'Extensión de Chrome para usar menos las redes sociales: escala de grises, límites diarios, bloqueos y ocultar lo que distrae. Todo queda en tu navegador.':'Chrome extension to use social media less: grayscale, daily limits, blocks and hiding what distracts. Everything stays in your browser.';
